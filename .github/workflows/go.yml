name: Build, Test and Release

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      GO_LDFLAGS: "-w -s"
      GO11MODULE: "on"
      GINKGO_FLAGS: "--randomizeAllSpecs --randomizeSuites --failOnPending --trace --race --progress --compilers=2 --nodes=2"
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('gh-action-{0}', github.sha) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26
          cache: true

      - name: Build Binary
        run: make all

      - name: Info Binary
        run: |
          ./kubecfg help
          ./kubecfg version

      - name: Test Binary
        run: |
          make test
          make vet

      # Only run integration on linux matrix job
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: matrix.os == 'ubuntu-latest'
        with:
          version: "v0.33.0"
          node_image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          wait: 300s

      - name: Integration Testing
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@$(go list -f '{{.Version}}' -m github.com/onsi/ginkgo/v2)
          make integrationtest GINKGO="ginkgo $GINKGO_FLAGS"

      - name: Upload kubecfg artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubecfg_${{ runner.os }}_${{ runner.arch }}
          path: kubecfg
          retention-days: 5

      - if: matrix.os == 'ubuntu-latest'
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Build OCI image using ko
        if: matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.fork
        run: ko build -B --push=false --platform linux/amd64,linux/arm/v7,linux/arm64

      - name: Build OCI image using ko and push it to ghcr
        if: matrix.os == 'ubuntu-latest' && !github.event.pull_request.head.repo.fork
        run: ko build -B --platform linux/amd64,linux/arm/v7,linux/arm64

      - name: Build OCI image using ko , tag and push it to ghcr
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=$(echo ${{ github.ref }} | cut -c11-)  # get tag name without tags/refs/ prefix.
          ko build -B --platform linux/amd64,linux/arm/v7,linux/arm64 --tags ${tag}

      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      # Wasm OCI artifact layout: https://tag-runtime.cncf.io/wgs/wasm/deliverables/wasm-oci-artifact/
      - name: Push kubecfg-show.wasm OCI artifact to ghcr
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/kubecfg-show
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        run: |
          make kubecfg-show.wasm
          digest=sha256:$(sha256sum kubecfg-show.wasm | cut -d' ' -f1)
          printf '{"architecture":"wasm","os":"wasip1","layerDigests":["%s"]}' "$digest" > wasm-config.json
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "$REPO:$TAG" \
            --config wasm-config.json:application/vnd.wasm.config.v0+json \
            kubecfg-show.wasm:application/wasm

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # renovate: tag=v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: true
          prerelease: false

  release:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: create_release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download kubecfg artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kubecfg_${{ runner.os }}_${{ runner.arch }}
      - name: Upload assets
        id: upload-release-asset
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # renovate: tag=v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: kubecfg
          asset_name: kubecfg_${{ runner.os }}_${{ runner.arch }}
          asset_content_type: application/octet-stream
