# Lints the todography map in docs/map: https://github.com/mkmik/todography
name: Map

on:
  push:
    branches: [main]
    paths: [docs/map/**, .github/workflows/map.yml]
  pull_request:
    branches: [main]
    paths: [docs/map/**, .github/workflows/map.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mkmik/todography@8aa6a1ef0830e62341ef59ffd841c2f0bb8cafdb # v0.19.0
        with:
          args: --strict
