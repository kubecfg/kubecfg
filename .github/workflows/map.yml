# Lints the todography map in docs/map: https://github.com/mkmik/todography
name: Map

on:
  push:
    branches: [main]
    paths: [docs/map/**, .github/workflows/map.yml]
  pull_request:
    branches: [main]
    paths: [docs/map/**, .github/workflows/map.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mkmik/todography@0b31ed23ff03908b2918447cd9c3a595c28645aa # v0.15.0
        with:
          args: --strict
