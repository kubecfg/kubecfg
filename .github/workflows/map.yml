# Lints the todography map in docs/map: https://github.com/mkmik/todography
name: Map

on:
  push:
    branches: [main]
    paths: [docs/map/**, .github/workflows/map.yml]
  pull_request:
    branches: [main]
    paths: [docs/map/**, .github/workflows/map.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mkmik/todography@a540d0f94cd9a02f664fcdca23ef47dcc59d6268 # v0.17.0
        with:
          args: --strict
