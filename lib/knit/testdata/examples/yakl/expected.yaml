---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    team: platform
  name: web
  namespace: prod
spec:
  replicas: 5
  template:
    spec:
      containers:
      - env:
        - name: LOG_LEVEL
          value: info
        - name: DB_HOST
          value: db.prod
        image: web:1.4
        name: web
---
apiVersion: v1
kind: Service
metadata:
  labels:
    team: platform
  name: web
  namespace: prod
spec:
  ports:
  - port: 80
  selector:
    app: web
