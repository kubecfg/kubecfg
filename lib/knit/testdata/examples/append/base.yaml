apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  template:
    spec:
      containers:
      - name: web
        image: web:1.0
        args: [--port=8080]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  template:
    spec:
      containers:
      - name: worker
        image: worker:1.0
        args: [--queue=jobs]
