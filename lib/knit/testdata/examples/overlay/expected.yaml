---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  labels:
    team: "platform"
  name: "web"
spec:
  replicas: 3
  template:
    spec:
      containers:
      - env:
        - name: "LOG_LEVEL"
          value: "info"
        - name: "DB_HOST"
          value: "db.prod"
        image: "web:1.4"
        name: "web"
      nodeSelector:
        kubernetes.io/os: "linux"
...
