---
apiVersion: v1
data:
  LOG_LEVEL: info
  nginx.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
      }
    }
kind: ConfigMap
metadata:
  name: web-46f4hk9t6g
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: web-46f4hk9t6g
        image: nginx:1.27
        name: web
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: conf
      - envFrom:
        - configMapRef:
            name: web-debug
        image: busybox:1.37
        name: debug
      volumes:
      - configMap:
          items:
          - key: nginx.conf
            path: default.conf
          name: web-46f4hk9t6g
        name: conf
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: web
---
apiVersion: v1
data:
  DEBUG: "true"
kind: ConfigMap
metadata:
  name: web-debug
---
apiVersion: v1
kind: Service
metadata:
  name: web-metrics
spec:
  ports:
  - name: metrics
    port: 9113
  selector:
    app: web
