---
apiVersion: v1
data:
  LOG_LEVEL: info
kind: ConfigMap
metadata:
  name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: web
        image: nginx:1.27
        name: web
        ports:
        - containerPort: 8080
      - image: nginx/nginx-prometheus-exporter:1.3
        name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: web
