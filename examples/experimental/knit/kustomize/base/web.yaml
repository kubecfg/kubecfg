# A web app as plain Kubernetes YAML.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-debug
data:
  DEBUG: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          envFrom:
            - configMapRef: {name: web}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
        - name: debug
          image: busybox:1.37
          envFrom:
            - configMapRef: {name: web-debug}
      volumes:
        - name: conf
          configMap:
            name: web
            items:
              - {key: nginx.conf, path: default.conf}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-metrics
spec:
  selector: {app: web}
  ports:
    - name: metrics
      port: 9113
