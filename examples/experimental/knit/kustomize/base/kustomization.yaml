apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - web.yaml
# The web ConfigMap gets a hash of its data after its name, and the Deployment's references to
# it follow, so the pods restart when it changes.
configMapGenerator:
  - name: web
    literals:
      - LOG_LEVEL=info
    files:
      - nginx.conf
