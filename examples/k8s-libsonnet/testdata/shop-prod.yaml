---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: api
  namespace: shop-prod
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: api
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: shop
    spec:
      containers:
      - env:
        - name: REDIS_URL
          value: redis://redis:6379
        image: registry.example.com/shop/api:1.4.2
        name: api
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts: []
      initContainers: []
      nodeSelector:
        example.com/pool: shop
      tolerations:
      - effect: NoSchedule
        key: example.com/pool
        value: shop
      volumes: []
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: api
  namespace: shop-prod
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/part-of: shop
  name: api
  namespace: shop-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: shop
  namespace: shop-prod
spec:
  rules:
  - host: shop.example.com
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              name: http
        path: /
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              name: http
        path: /api
        pathType: Prefix
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/part-of: shop
  name: redis
  namespace: shop-prod
spec:
  ports:
  - name: redis
    port: 6379
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: redis
  namespace: shop-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  serviceName: redis
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: redis
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: shop
    spec:
      containers:
      - args:
        - --appendonly
        - "yes"
        env: []
        image: redis:7.4
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: 2Gi
        volumeMounts:
        - mountPath: /data
          name: data
      initContainers: []
      nodeSelector:
        example.com/pool: shop
      tolerations:
      - effect: NoSchedule
        key: example.com/pool
        value: shop
      volumes: []
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: web
  namespace: shop-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: web
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: shop
    spec:
      containers:
      - env:
        - name: API_URL
          value: http://api
        image: registry.example.com/shop/web:1.4.2
        name: web
        ports:
        - containerPort: 8080
          name: http
        volumeMounts: []
      initContainers: []
      nodeSelector:
        example.com/pool: shop
      tolerations:
      - effect: NoSchedule
        key: example.com/pool
        value: shop
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/part-of: shop
  name: web
  namespace: shop-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: web
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: worker
  namespace: shop-prod
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            kubectl.kubernetes.io/default-container: worker
          labels:
            app.kubernetes.io/part-of: shop
        spec:
          containers:
          - args:
            - reindex
            env:
            - name: REDIS_URL
              value: redis://redis:6379
            image: registry.example.com/shop/api:1.4.2
            name: worker
            ports: []
            volumeMounts: []
          initContainers: []
          nodeSelector:
            example.com/pool: shop
          restartPolicy: OnFailure
          tolerations:
          - effect: NoSchedule
            key: example.com/pool
            value: shop
          volumes: []
  schedule: 0 3 * * *
